[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serve-bench"
version = "0.1.0"
description = "Mac-first LLM serving and benchmarking platform with a pluggable backend interface"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "psutil>=5.9",
]

# Declared here only. Nothing is installed in Phase 1.
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
tracking = ["mlflow>=2.10"]
plots = ["matplotlib>=3.8"]
all = ["llm-serve-bench[dev,tracking,plots]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "benchmarks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
