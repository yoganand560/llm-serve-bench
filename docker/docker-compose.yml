# NOT built or tested on this Mac. Docker is not installed here.
# Only the gateway is containerised: llama-server uses Metal and must stay native.
services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      LLM_SERVE_CONFIG: /app/configs/default.yaml
    volumes:
      - ../configs:/app/configs:ro

